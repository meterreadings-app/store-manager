const DEV=(()=>{let d='nodev';try{d=localStorage.getItem('mr:dev');if(!d){d=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem('mr:dev',d)}}catch(e){}return d})();
const PACK={1:250,2:250,3:250,5:100,10:50,20:50,30:50,50:50};
function calc(r){
 if(blank(r.b)||blank(r.e))return{rev:0,vol:0,flag:'',pb:false,bb:false,eb:false};
 const b=num(r.b),e=num(r.e),p=blank(r.p)?0:num(r.p),pb=isNaN(p),pack=PACK[p];
 if(pack){const bb=!(b>=0&&b<=pack),eb=!(e>=0&&e<=pack);
  if(bb||eb)return{rev:0,vol:0,flag:t('range').replace('{n}',pack),pb,bb,eb};
  const vol=e<=b?b-e:b+(pack-e);return{rev:vol*p,vol,flag:'',pb,bb,eb,newPack:e>b}}
 const bb=!(b>=0),eb=!(e>=0);if(bb||eb||pb)return{rev:0,vol:0,flag:'!',pb,bb,eb};
 if(e>b)return{rev:0,vol:0,flag:t('unkPrice'),pb:true,bb,eb:true};
 const vol=b-e;return{rev:vol*p,vol,flag:'',pb,bb,eb};
}

 if(x.role==='worker'){const w=await dec(kk,x.wrap);me={tid:x.tid,role:'worker',wid:x.wid,h,email,K:w.k,C:w.c}}
 else{let K;if(x.bwrap)K=(await dec(kk,x.bwrap)).k;else{K=b64(crypto.getRandomValues(new Uint8Array(32)));await db.doc('access/'+h).update({bwrap:await enc(kk,{k:K})})}

 await db.doc('data/users/'+AUID+'/me').set(me);try{sessionStorage.setItem('mr:in','1');sessionStorage.setItem('mr:at',String(Date.now()))}catch(_){}ME=me;uid=stableId(me);MYK=null;NAMES=null;start();return true;

/* ---------- cashier (online) lottery receipt ---------- */
const RF=[["sales", "Sales", true, 1], ["cancels", "Cancels", true, -1], ["cashes", "Cashes", true, -1], ["promo", "Promo credit", true, 1], ["cashless", "Cashless sales", true, 1], ["balance", "Balance", false, 1], ["valid", "Instant validations", true, -1], ["net", "Net sales and credits due", false, 1], ["books", "Instant books activated", true, 1], ["ret", "Return adj", false, 1]];
/* receipt parser: OCR text -> fields */
function parseReceipt(txt){
 const out={},warn=[];const T=txt.toUpperCase().replace(/[“”"'`‘’]/g,'');
 if(/WEEK\s*TO\s*DATE/.test(T))warn.push('week');
 const dm=T.match(/(\d{2})-([A-Z]{3})-(\d{4})/);if(dm){const mi='JANFEBMARAPRMAYJUNJULAUGSEPOCTNOVDEC'.indexOf(dm[2]);if(mi>=0)out.date=dm[3]+'-'+String(mi/3+1).padStart(2,'0')+'-'+dm[1]}
 const lines=T.split(/\n/).map(l=>l.trim()).filter(Boolean);
 const amt=l=>{const m=[...l.replace(/[O]/g,'0').matchAll(/(-?)\s?(\d{1,3}(?:,\d{3})+|\d+)\s?[.,\- ]\s?(\d{2})(?!\d)/g)];if(!m.length)return null;const x=m[m.length-1];return (x[1]?-1:1)*Number(x[2].replace(/,/g,'')+'.'+x[3])};
 const cnt=l=>{const m=l.replace(/[O]/g,'0').match(/(\d[\d,]*)\s*(?=[A-Z])/);return m?Number(m[1].replace(/,/g,'')):null};
 const K=[['cashless',/CASHLESS/],['cancels',/C?ANCEL/],['cashes',/CASHES|ASHES/],['promo',/PROMO|CREDIT(?!S)/],['sales',/(?<!NET )SALES(?! AND)/],['balance',/BALANCE/],['valid',/VALIDATION/],['net',/NET\s*SALES|CREDITS\s*DUE/],['ret',/RETURN|RN\s*AD/]];
 for(let i=0;i<lines.length;i++){const l=lines[i];
  for(const[k,re]of K){if(out[k]!==undefined||!re.test(l))continue;if(k==='sales'&&/CASHLESS|NET/.test(l))continue;
   let a=amt(l);if(a===null&&lines[i+1]&&!/[A-Z]{3}/.test(lines[i+1]))a=amt(lines[i+1]);if(a===null&&k==='balance'&&lines[i-1])a=amt(lines[i-1]);
   if(a!==null)out[k]=a;const c=cnt(l);if(c!==null&&!['balance','net','ret'].includes(k))out[k+'N']=c;break}
  if(/BOOKS\s*ACTIVATED/.test(l)){for(let j=i+1;j<Math.min(i+4,lines.length);j++){const c=lines[j].match(/^\D*?(\d+)\s+(.*)$/);const a=amt(c?c[2]:lines[j]);if(a!==null){out.books=a;if(c)out.booksN=Number(c[1]);break}}}
 }
 for(const k of ['cancels','cashes','valid'])if(out[k]!==undefined)out[k]=-Math.abs(out[k]);
 return {f:out,warn};
}
function checkReceipt(f){const v=k=>Number(f[k])||0,r={};
 if(f.sales!=null&&f.balance!=null){r.bal=Math.abs(v('sales')+v('cancels')+v('cashes')+v('promo')+v('cashless')-v('balance'))<0.01}
 if(f.balance!=null&&f.net!=null){r.net=Math.abs(v('balance')+v('valid')-v('net'))<0.01}
 return r}


function deriveReceipt(f){const v=k=>Number(f[k])||0,has=k=>f[k]!==undefined&&f[k]!==''&&!isNaN(Number(f[k])),d=[];
 if(has('net')&&has('valid')){const b=Math.round((v('net')-v('valid'))*100)/100;if(!has('balance')||Math.abs(v('balance')-b)>0.009){f.balance=b;d.push('balance')}}
 if(!has('sales')&&has('balance')&&has('cancels')&&has('cashes')){f.sales=Math.round((v('balance')-v('cancels')-v('cashes')-v('promo')-v('cashless'))*100)/100;d.push('sales')}
 return d}
let TESS=null;function loadTess(){return TESS||(TESS=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>res(window.Tesseract);sc.onerror=()=>{TESS=null;rej(new Error('lib'))};document.head.appendChild(sc)}))}
function prepReceipt(img){let w=img.naturalWidth,h=img.naturalHeight;const sc=w<2000?Math.min(2,2400/w):Math.min(1,2400/w);w=Math.round(w*sc);h=Math.round(h*sc);
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(img,0,0,w,h);const D=x.getImageData(0,0,w,h),px=D.data,n=w*h,g=new Float32Array(n);
 for(let i=0;i<n;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
 const pct=(a,q)=>{const hs=new Uint32Array(256);for(let i=0;i<a.length;i+=7)hs[Math.max(0,Math.min(255,a[i]|0))]++;let t=0,tot=Math.ceil(a.length/7),k=0;for(;k<256;k++){t+=hs[k];if(t>=tot*q)break}return k};
 const ac=a=>{const lo=pct(a,.01),hi=pct(a,.99),r=255/Math.max(1,hi-lo);for(let i=0;i<a.length;i++)a[i]=Math.max(0,Math.min(255,(a[i]-lo)*r))};ac(g);
 const I=new Float64Array((w+1)*(h+1));for(let y=0;y<h;y++){let row=0;for(let xx=0;xx<w;xx++){row+=g[y*w+xx];I[(y+1)*(w+1)+xx+1]=I[y*(w+1)+xx+1]+row}}
 const R=30,dd=new Float32Array(n);for(let y=0;y<h;y++){const y0=Math.max(0,y-R),y1=Math.min(h,y+R+1);for(let xx=0;xx<w;xx++){const x0=Math.max(0,xx-R),x1=Math.min(w,xx+R+1);
  const m=(I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0])/((y1-y0)*(x1-x0));dd[y*w+xx]=Math.max(0,m-g[y*w+xx])}}
 ac(dd);for(let i=0;i<n;i++){const v=(255-dd[i])>150?255:0;px[i*4]=px[i*4+1]=px[i*4+2]=v;px[i*4+3]=255}x.putImageData(D,0,0);return cv}
async function ocrReceipt(file,onStep){const T=await loadTess();onStep&&onStep(1);const img=new Image();img.src=URL.createObjectURL(file);await img.decode();const cv=prepReceipt(img);onStep&&onStep(2);
 const w=await T.createWorker('eng');await w.setParameters({tessedit_pageseg_mode:'6'});const {data}=await w.recognize(cv);await w.terminate();return data.text}

 </div><p class="note" id="rcChk" style="margin:8px 0 0"></p></div>
 <div class="card"><h3 class="sec" style="margin-top:0">${t('cashH')}</h3><div class="row"><div><label>${t('cCount')}</label><input id="cc1" inputmode="decimal"></div><div><label>${t('cRet')}</label><input id="cc3" inputmode="decimal"></div></div>
 <div class="row" style="margin-top:10px"><div class="kpi" style="background:var(--tot);color:var(--accent)"><span>${t('expct')}</span><b id="ce">0</b><small id="cs"></small></div><div class="kpi" id="cov"><span>${t('overS')}</span><b id="co">—</b></div></div></div>`;
 $('#dt').value=date;
 const path=()=>'t/'+ME.tid+'/days/'+uid+'_'+date,keep0=()=>rows.filter(r=>!(blank(r.b)&&blank(r.e))),cp=r=>({g:r.g||'',n:r.n||'',c:r.c||'',p:r.p??'',b:r.b??'',e:r.e??'',src:r.src||''});
 const gopts=sel=>`<option value="">${t('cust')}</option>`+CAT.games.map(g=>`<option value="${esc(g.id)}"${g.id===sel?' selected':''}>${esc(g.name)} · ${g.price}</option>`).join('');
 async function load(){ready=false;$('#st').textContent=t('loading');let p=null,pv=null;
  try{const s=await db.doc(path()).get();if(s.exists)p=await dec(await myKey(),s.data().enc)}catch(e){}
  try{pv=await prevDay(date)}catch(e){}
  last={};if(pv)pv.rows.forEach(r=>{if(r.g)last[r.g]=blank(r.e)?r.b:r.e});
  if(p){rows=p.rows.length?p.rows.map(cp):[nr()];cap=p.cap;cash=p.cash||{c:'',p:'',x:''}}
  
  else{rows=[nr()];cap=50;cash={c:'',p:'',x:''}}
  $('#cc1').value=cash.c;$('#cc3').value=cash.x;cash.r=cash.r||{};rcFill();build();prev=keep0().map(r=>({p:r.p,b:r.b,e:r.e}));ready=true;
  applyLock();$('#st').textContent=LOCK()?'🔒 '+t('locked'):p?t('loaded'):t('newDay')}
 function applyLock(){const L=LOCK();['cpy','cpd','add','add10'].forEach(i=>{$('#'+i).hidden=L});['cc1','cc3'].forEach(i=>{$('#'+i).readOnly=L});if(window.rcFillLock)0;document.querySelectorAll('#rcCard input').forEach(i=>i.readOnly=L);if($('#rcScanL'))$('#rcScanL').hidden=L;document.querySelector('#rs').closest('.card').classList.toggle('lockd',L)}
 const LOCK=()=>date!==ymd(new Date());
 function build(){const tb=$('#rs');tb.innerHTML='';rows.forEach((r,i)=>{r.n=String(i+1);const tr=document.createElement('tr');
  tr.innerHTML=`<td>${i+1}</td>`+['p','b','e'].map(k=>`<td class="c-${k}"><input data-i="${i}" data-k="${k}" inputmode="decimal" value="${esc(r[k])}"${LOCK()?' readonly':''}></td>`).join('')+`<td class="n"></td><td class="n"></td><td class="flag"></td><td>${LOCK()?'':`<button class="x" data-d="${i}">✕</button>`}</td>`;tb.appendChild(tr)});
  const tr=document.createElement('tr');tr.className='t';tr.innerHTML=`<td></td><td colspan="3">${t('total')}</td><td class="n" id="tr"></td><td class="n" id="tv"></td><td></td><td></td>`;tb.appendChild(tr);upd()}
 function upd(){const c0=0;let R=0,V=0;const trs=$('#rs').querySelectorAll('tr:not(.t)');
  rows.forEach((r,i)=>{const x=calc(r,c0),tr=trs[i],ins=tr.querySelectorAll('input'),td=tr.querySelectorAll('td');R+=x.rev;V+=x.vol;
   ins[0].classList.toggle('bad',x.pb);ins[1].classList.toggle('bad',x.bb);ins[2].classList.toggle('bad',x.eb);td[4].textContent=fmt(x.rev);td[5].textContent=fmt(x.vol);td[6].textContent=x.flag});
  $('#tr').textContent=$('#kr').textContent=fmt(R);$('#tv').textContent=$('#kv').textContent=fmt(V);showWarn(rows,c0);
  const xc=num(cash.x)||0,k=num(cash.c),rs=num((cash.r||{}).sales)||0,ex=R+rs-xc;$('#ce').textContent=fmt(ex);$('#cs').textContent=t('scratchS')+' '+fmt(R)+' + '+t('cashierS')+' '+fmt(rs)+(xc?' − '+fmt(xc):'');
  if(blank(cash.c)||isNaN(k)){$('#co').textContent='—';$('#cov').className='kpi'}else{const o=k-ex;$('#co').textContent=(o>0?'+':'')+fmt(o);$('#cov').className='kpi '+(Math.abs(o)<=(CAT.tol??5)?'ok':o<0?'short':'over')}}
 async function doSave(){clearTimeout(tm);window.__flush=null;if(LOCK())return;const keep=keep0();
  try{if(ME.role!=='owner'){const a=await db.doc('access/'+ME.h).get();if(!a.exists){gate(t('removed'));return}}
   const ch=diffRows(prev,keep),k=await myKey();
   await db.doc(path()).set({u:uid,d:date,l:LABEL(),enc:await enc(k,{cap,rows:keep,cash})});
   if(ch.length)await db.doc('t/'+ME.tid+'/audit/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)).set({u:uid,d:date,l:LABEL(),ts:Date.now(),enc:await enc(k,{by:ME.email||'',ch})});
   prev=keep.map(r=>({p:r.p,b:r.b,e:r.e}));$('#st').textContent=t('saved')}catch(e){$('#st').textContent=t('notSaved')+(e.message||e.code)}}
 function changed(){upd();if(!ready||LOCK())return;$('#st').textContent=t('saving');clearTimeout(tm);window.__flush=doSave;tm=setTimeout(doSave,700)}
 async function copyPrev(src){
  let pv=null;try{pv=src?await dayAt(src):await prevDay(date)}catch(e){}
  if(!pv||!pv.rows.length){$('#st').textContent=src?t('noDay')+' '+src:t('noPrev');return}
  const nrw=pv.rows.map(r=>({...cp(r),g:'',n:GAME,c:'',b:blank(r.e)?String(r.b??''):String(r.e),e:'',src:pv.d}));
  const mine=rows.filter(r=>!r.src&&!(blank(r.p)&&blank(r.b)&&blank(r.e)));
  rows=mine.concat(nrw);build();changed();$('#st').textContent=t('copiedFrom')+' '+pv.d}
 $('#cpy').onclick=()=>copyPrev();
 const cpdt=$('#cpdt');$('#cpd').onclick=()=>{cpdt.max=date;cpdt.value='';try{cpdt.showPicker()}catch(e){cpdt.style.cssText='width:auto;margin-top:6px';cpdt.focus()}};
 cpdt.onchange=()=>{const v=cpdt.value;if(!v)return;if(v===date){$('#st').textContent=t('noDay')+' '+v;return}copyPrev(v)};
 $('#rs').oninput=e=>{const d=e.target.dataset;if(d.k&&d.k!=='g'&&d.k!=='n'){rows[d.i][d.k]=e.target.value;changed()}};
 $('#rs').onchange=e=>{const d=e.target.dataset;if(d.k==='g'){const r=rows[d.i],g=CAT.games.find(x=>x.id===e.target.value);r.g=e.target.value;if(g){r.n=g.name;r.c=g.size;r.p=String(g.price);if(blank(r.b)&&last[g.id]!==undefined)r.b=String(last[g.id])}else{r.n='';r.c=''}build();changed()}};
 $('#rs').onclick=e=>{const d=e.target.dataset.d;if(d!==undefined&&!LOCK()){rows.splice(d,1);if(!rows.length)rows.push(nr());build();changed()}};
 [['cc1','c'],['cc3','x']].forEach(([i,k])=>$('#'+i).oninput=e=>{cash[k]=e.target.value;changed()});
 function rcFill(marks){const r=cash.r||{};document.querySelectorAll('#rcCard [data-ra],#rcCard [data-rn]').forEach(i=>{const k=i.dataset.ra||i.dataset.rn;i.value=r[k]??'';i.readOnly=LOCK();i.classList.toggle('chk',!!(marks&&marks.includes(k)))});$('#rcScanL').hidden=LOCK();rcCheck()}
 function rcCheck(){const r=cash.r||{},c=checkReceipt(r),bad=[];if(c.bal===false)bad.push('sales','cancels','cashes','promo','cashless','balance');if(c.net===false)bad.push('balance','valid','net');
  document.querySelectorAll('#rcCard .rr').forEach(x=>x.classList.toggle('bad',bad.includes(x.dataset.rk)));
  $('#rcChk').textContent=(c.bal||c.net)&&!bad.length?'✓ '+t('rcOk'):bad.length?'⚠ '+t('rcBad'):'';$('#rcChk').style.color=bad.length?'var(--bad)':'var(--good)'}
 $('#rcCard').addEventListener('input',e=>{const k=e.target.dataset.ra||e.target.dataset.rn;if(!k||LOCK())return;cash.r=cash.r||{};const v=e.target.value.trim();if(v==='')delete cash.r[k];else cash.r[k]=v;e.target.classList.remove('chk');rcCheck();changed()});
 $('#rcFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||LOCK())return;const m=$('#rcMsg');m.style.color='var(--muted)';m.textContent='⏳ '+t('rcLoading');
  try{const txt=await ocrReceipt(f,st=>{m.textContent='⏳ '+(st===1?t('rcReading'):t('rcReading'))});const {f:got,warn}=parseReceipt(txt);const der=deriveReceipt(got);
   const keys=Object.keys(got).filter(k=>k!=='date');if(!keys.length){m.style.color='var(--bad)';m.textContent='⚠ '+t('rcFail');return}
   cash.r={...(cash.r||{})};keys.forEach(k=>cash.r[k]=String(got[k]));rcFill(keys);changed();
   const notes=[t('rcDone')];if(warn.includes('week'))notes.push(t('rcWeek'));if(got.date&&got.date!==date)notes.push(t('rcDate').replace('{d}',got.date));if(!('sales' in got))notes.push(t('rcNoSales'));
   m.style.color=notes.length>1?'var(--bad)':'var(--good)';m.textContent='📷 '+notes.join(' ')}
  catch(er){m.style.color='var(--bad)';m.textContent='⚠ '+(er.message==='lib'?t('rcLib'):t('rcFail'))}};
 $('#add').onclick=()=>{rows.push(nr());build()};$('#add10').onclick=()=>{for(let i=0;i<10;i++)rows.push(nr());build()};
 $('#dt').onchange=async e=>{if(!e.target.value)return;if(window.__flush)await window.__flush();date=e.target.value;load()};
 load();
}

const reconHead=en=>en?{date:'Date',worker:'Name',sales:'Scratch card sales',rs:'Cashier sales',x:'Returned/damaged',ex:'Expected cash',k:'Cash counted',ov:'Over/short'}:{date:t('date'),worker:t('nameL'),sales:t('scratchS'),rs:t('cashierS'),x:t('cRet'),ex:t('expct'),k:t('cCount'),ov:t('overS')};

  const cols=['date'].concat(all?['worker']:[],['sales','rs','x','ex','k','ov']),H=reconHead(fm==='pdf'),head=cols.map(c=>H[c]),body=rr.map(r=>cols.map(c=>r[c]??''));
  const base='reconciliation_'+f+'_to_'+tt,dl=await claude.use('downloads');if(!dl){st.textContent=t('noDl');return}

   doc.autoTable({head:[head],body:body.map(r=>r.map(v=>typeof v==='number'?fmt(v):v)),startY:y0,margin:{left:14,right:14,top:16,bottom:18},styles:{fontSize:8},headStyles:{fillColor:[79,70,229]},alternateRowStyles:{fillColor:[245,246,250]}});pdfFooter(doc);

}

function sheet(html){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div>${html}</div>`;document.body.appendChild(s);s.onclick=e=>{if(e.target===s)s.remove()};return s}
function langSheet(after){const s=sheet(`<h4>🌐 ${t('lang')}</h4><div class="langs">${LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===LANG?'on':''}">${n}</button>`).join('')}</div>`);
 s.querySelector('.langs').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;setPref('lang',LANG);applyPrefs();s.remove();(after||(()=>go(view,cur)))()}}
function menuSheet(){const s=sheet(`<button class="mi" data-g="ov"><span>🏠</span>${t('overviewT')}</button><button class="mi" data-g="meter"><span>🎟</span>${t('meterT')}</button><hr style="border:none;border-top:1px solid var(--line);margin:6px 0">
 <button class="mi" data-g="home"><span>🛒</span>${t('ordersT')}</button><button class="mi" data-g="companies"><span>🏢</span>${t('companies')}</button><button class="mi" data-g="review"><span>🧾</span>${t('review')}</button><button class="mi" data-g="history"><span>🕘</span>${t('history')}</button><button class="mi" data-g="addco"><span>➕</span>${t('addCo')}</button>
 <hr style="border:none;border-top:1px solid var(--line);margin:6px 0"><button class="mi" data-g="settings"><span>⚙️</span>${t('settings')}</button><button class="mi" data-g="out"><span>🚪</span>${t('logout')}</button>`);
 s.onclick=e=>{if(e.target===s){s.remove();return}const b=e.target.closest('[data-g]');if(!b)return;s.remove();const g=b.dataset.g;if(g==='ov')return HOST.overview();if(g==='meter')return HOST.meter();if(g==='settings')return HOST.settings();if(g==='out')return HOST.logout();go(g)}}
/* ---------- shell ---------- */
function shell(title,sub,back,body,noBar){
 app.innerHTML=`<div class="hero">${back?`<button class="ib" id="bk" aria-label="${t('back')}">${RTL.includes(LANG)?'›':'‹'}</button>`:`<div class="logo">D</div>`}<div class="ttl"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><button class="ib" id="mn" aria-label="Menu">☰</button></div>
 ${DEMO?`<div class="demo">${t('demo')}</div>`:''}${body}${noBar?'':bar()}`;
 if(back)$('#bk').onclick=back;$('#mn').onclick=menuSheet;
 const rb=$('#barRev');if(rb)rb.onclick=()=>go('review');
}
function bar(){const x=totals();return `<div class="bar"><div><div class="sum"><b id="bBoxes">${x.boxes}</b> ${t('boxes').toLowerCase()}<br><span id="bItems">${t('sumBar',{b:x.boxes,p:x.items}).split('·')[1]||''}</span></div><button class="p" id="barRev">🧾 ${t('review')}</button></div></div>`}
function updBar(){const x=totals();if($('#bBoxes')){$('#bBoxes').textContent=x.boxes;$('#bItems').textContent=t('sumBar',{b:x.boxes,p:x.items}).split('·')[1]||''}}
function go(v,arg){if(v!=='company')cur2='all';view=v;if(v==='company'||v==='hist1')cur=arg;window.scrollTo(0,0);({home,companies,company,review,history,addco:addCompany,hist1:histOne,settings}[v])(arg)}

 <div id="below"></div><input type="file" id="lgf" accept="image/*" hidden>`);

 const cell=(p,k,ph,mode)=>`<input class="xc xc-${k}" dir="auto" data-k="${k}" value="${esc(k==='price'?(p.price??''):p[k]||'')}" placeholder="${esc(ph)}"${mode?` inputmode="${mode}"`:''}>`;
 const drawAll=()=>{const f=s.trim().toLowerCase();
  const head=`<div class="xr xh"><div class="xn">⠿</div><div>A · ${t('product')}</div><div class="r">B · ${t('boxes')}</div></div>`;
  const rows=c.products.map((p,i)=>{if(f&&!(p.name+' '+p.size).toLowerCase().includes(f))return'';const v=ORDER.lines[p.id]?.qty||0;
   return `<div class="xr${v?' has':''}" data-pid="${p.id}"><button class="xn" data-menu="${i}" title="${esc(t('rowMenu'))}"><span class="hd">⠿</span>${i+1}</button><div>${cell(p,'name',t('prodName'))}${dupName(c,p)?`<small class="dup">${esc(p.size)}</small>`:''}</div>

  $('#grid').innerHTML=head+rows+`<div class="xr xadd"><div class="xn">+</div><div style="grid-column:2/-1"><button class="lnk" id="addEnd">➕ ${t('addRow')}</button></div></div>`;
  $('#below').innerHTML=`<p class="note" style="margin:8px 4px">💡 ${t('gridHint')} ${t('dragHint')}</p>${true?`<div class="card" style="margin-top:12px"><button class="d" id="dc">🗑 ${t('delCo')}</button><p class="note">${t('delCoNote')}</p></div>`:''}`;
  $('#addEnd').onclick=()=>insertAt(c.products.length);
  if($('#dc'))$('#dc').onclick=async e=>{const b=e.target;if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent=t('tapAgain');return}
   c.products.forEach(p=>delete ORDER.lines[p.id]);saveOrder();await store.del('companies/'+c.id);COS=COS.filter(x=>x.id!==c.id);toast(t('coDeleted'));cur2='all';go('companies')}};
 const drawOrd=()=>{const ps=ordRows(),rows=ps.map(p=>({company:c.name,cid:c.id,product:dispName(c,p),size:p.size||'',qty:ORDER.lines[p.id].qty,unit:unitOf(p,ORDER.lines[p.id])}));
  $('#grid').innerHTML=rows.length?`<div class="xr xo xh"><div class="xn"></div><div>${t('product')}</div><div class="r">${t('boxes')}</div></div>`+
   rows.map((r,i)=>`<div class="xr xo has" data-pid="${ps[i].id}"><div class="xn">${i+1}</div><div><b>${esc(r.product)}</b></div>
   <div class="r"><div class="mini"><button data-d="-1">−</button><input class="q" inputmode="numeric" value="${r.qty}"><button class="pl" data-d="1">+</button></div></div></div>`).join('')+
   `<div class="xr xo xt"><div class="xn">Σ</div><div><b>${t('total')}</b></div><div style="align-items:flex-end;padding:8px"><b>${esc(unitSum(rows))}</b></div></div>`
   :`<p class="empty">🛒 ${t('sheetEmpty')}</p><div style="text-align:center;padding-bottom:16px"><button class="p" id="toAll">📋 ${t('tabAll')}</button></div>`;
  $('#below').innerHTML=rows.length?`<div class="card" style="margin-top:12px"><h3 class="sec">⬇ ${t('coExport')}</h3>
   <div class="acts" style="margin-top:0"><button class="p" data-x="xlsx">📊 ${t('excel')}</button><button class="p" data-x="pdf">📄 ${t('pdf')}</button><button data-x="img">🖼 ${t('picture')}</button><button data-x="txt">📋 ${t('copyTxt')}</button><button class="g" data-x="share">📤 ${t('share')}</button></div>

 const draw=()=>{document.querySelector('.xl-fx').style.display=tab==='all'?'':'none';(tab==='all'?drawAll:drawOrd)()};

 const switchTab=async x=>{if(x==='ord')await purge();tab=cur2=x;document.querySelectorAll('.xl-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===x));draw();window.scrollTo(0,0)};
 const setQ=(pid,v)=>{v=Math.max(0,Math.min(999,Math.floor(Number(v)||0)));const p=c.products.find(x=>x.id===pid);if(!p)return;

  if(navigator.vibrate)navigator.vibrate(8);saveOrder();updBar();updTabs();
  if(tab==='ord'){drawOrd();return}const row=document.querySelector(`[data-pid="${pid}"]`);row.classList.toggle('has',v>0);row.querySelector('.q').value=v||''};
 let saveT2=null;const saveSoon=()=>{clearTimeout(saveT2);saveT2=setTimeout(()=>saveCo(c).catch(e=>toast(t('notSaved')+(e.code||e.message))),500)};
 const insertAt=i=>{const np={id:uidGen(),name:'',size:'',custom:true};c.products.splice(i,0,np);s='';$('#pq').value='';drawAll();updTabs();
  const r=document.querySelector(`[data-pid="${np.id}"]`);r.classList.add('new');r.scrollIntoView({block:'center'});setTimeout(()=>r.querySelector('[data-k="name"]').focus(),60)};
 const rowMenu=i=>{const p=c.products[i];const sh=sheet(`<h4>${t('rowL')} ${i+1}${p.name?' · '+esc(p.name):''}</h4>
  <button class="mi" data-a="above"><span>⬆️</span>${t('insAbove')}</button><button class="mi" data-a="below"><span>⬇️</span>${t('insBelow')}</button>
  ${i>0?`<button class="mi" data-a="up"><span>↑</span>${t('moveUp')}</button>`:''}${i<c.products.length-1?`<button class="mi" data-a="down"><span>↓</span>${t('moveDown')}</button>`:''}
  <button class="mi" data-a="del" style="color:var(--bad)"><span>🗑</span>${t('delRow')}</button>`);
  sh.onclick=async e=>{if(e.target===sh){sh.remove();return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
   if(a==='del'&&b.dataset.c!=='1'){b.dataset.c='1';b.lastChild.textContent=t('tapAgain');return}sh.remove();
   if(a==='above')return insertAt(i);if(a==='below')return insertAt(i+1);
   if(a==='up'||a==='down'){const j=a==='up'?i-1:i+1;[c.products[i],c.products[j]]=[c.products[j],c.products[i]];await saveCo(c);drawAll();const r=document.querySelector(`[data-pid="${p.id}"]`);if(r){r.classList.add('new');r.scrollIntoView({block:'center'})}return}
   if(a==='del'){c.products.splice(i,1);delete ORDER.lines[p.id];saveOrder();await saveCo(c);updBar();toast(t('removed'));drawAll();updTabs()}}};
 draw();
 $('#pq').oninput=e=>{s=e.target.value;drawAll()};
 document.querySelector('.xl-tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)};
 const G=$('#grid');
 let drag=null,justDragged=false;
 G.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-menu]');if(!h||tab!=='all')return;const row=h.closest('.xr');drag={row,pid:row.dataset.pid,y0:e.clientY,on:false,id:e.pointerId,h}});
 const rowsNow=()=>[...G.querySelectorAll('.xr[data-pid]')];
 window.onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;const dy=e.clientY-drag.y0;
  if(!drag.on){if(Math.abs(dy)<8)return;drag.on=true;try{drag.h.setPointerCapture(e.pointerId)}catch(_){}drag.row.classList.add('dragging');document.body.classList.add('noselect')}
  e.preventDefault();drag.row.style.transform=`translateY(${dy}px)`;
  if(e.clientY<80)window.scrollBy(0,-12);else if(e.clientY>innerHeight-110)window.scrollBy(0,12);

  others.forEach(r=>r.classList.remove('dropB','dropA'));if(tgt)tgt.classList.add('dropB');else if(others.length)others[others.length-1].classList.add('dropA');drag.tgt=tgt?tgt.dataset.pid:null};
 window.onpointerup=window.onpointercancel=async e=>{if(!drag)return;const d=drag;drag=null;document.body.classList.remove('noselect');if(!d.on)return;justDragged=true;setTimeout(()=>justDragged=false,80);
  const from=c.products.findIndex(p=>p.id===d.pid);const [it]=c.products.splice(from,1);let to=d.tgt?c.products.findIndex(p=>p.id===d.tgt):c.products.length;c.products.splice(to,0,it);

 const pick=()=>$('#lgf').click();
 $('#lgb').onclick=()=>{const sh=sheet(`<h4>🖼 ${t('logo')}</h4><button class="mi" id="l1"><span>📷</span>${t('logoChange')}</button>${c.logo?`<button class="mi" id="l2"><span>🌐</span>${t('logoReset')}</button>`:''}`);

}
/* ---------- add company ---------- */
function addCompany(){
 const cats=[...new Set(Object.keys(I18N.C.en).concat(COS.map(c=>c.cat)))].sort();

/* ---------- order data ---------- */
const UNITS=['Box','Case','Pack','Can','Bottle','Bag','Carton','Piece'];
const uT=u=>((I18N.U[LANG]||I18N.U.en)[UNITS.indexOf(u)]||u);
const unitOf=(p,l)=>(l&&l.unit)||p.unit||'Box';
function unitSum(rows,en){return String(rows.reduce((a,r)=>a+r.qty,0))}
function unitSumOld(rows,en){const m={};rows.forEach(r=>{m[r.unit]=(m[r.unit]||0)+r.qty});return UNITS.filter(u=>m[u]).concat(Object.keys(m).filter(u=>!UNITS.includes(u))).map(u=>m[u]+' '+(en?u:uT(u))).join(' · ')||'0'}
const dupName=(c,p)=>p.size&&c.products.some(x=>x!==p&&(x.name||'').trim().toLowerCase()===(p.name||'').trim().toLowerCase());
const dispName=(c,p)=>p.name+(dupName(c,p)?' ('+p.size+')':'');
function orderRows(){return lines().map(([pid,l])=>{const[c,p]=findProd(pid);return c&&p?{company:c.name,cid:c.id,product:dispName(c,p),pname:p.name,size:p.size||'',qty:l.qty,unit:unitOf(p,l)}:null}).filter(Boolean)
 .sort((a,b)=>a.company.localeCompare(b.company)||a.product.localeCompare(b.product))}
const sumBoxes=r=>r.reduce((a,x)=>a+x.qty,0);
function groups(rows){const g=[];for(const r of rows){let x=g.find(y=>y.company===r.company);if(!x){x={company:r.company,cid:r.cid,rows:[]};g.push(x)}x.rows.push(r)}return g}
function orderView(rows){
 return groups(rows).map(g=>{const c=coById(g.cid)||COS.find(x=>x.name===g.company)||{name:g.company};
  return `<div class="grp"><div class="gh">${logoHTML(c,36)}<div class="nm"><b>${esc(g.company)}</b><small>${esc(unitSum(g.rows))}</small></div><button data-send="${esc(g.company)}">📤 ${t('share')}</button></div>
  ${g.rows.map(r=>`<div class="gl"><span>${esc(r.product)}</span><b>${r.qty}</b></div>`).join('')}</div>`}).join('')+
 `<div class="tot"><span>${t('total')}<br><small style="opacity:.75">${rows.length} ${t('products').toLowerCase()}</small></span><span style="text-align:end"><b>${esc(unitSum(rows))}</b></span></div>`}
function exportBox(){return `<label>⬇ ${t('onlyQty')}</label><div class="acts" style="margin-top:0"><button class="p" data-x="xlsx">📊 ${t('excel')}</button><button class="p" data-x="pdf">📄 ${t('pdf')}</button><button data-x="img">🖼 ${t('picture')}</button><button data-x="txt">📋 ${t('copyTxt')}</button><button data-x="share">📤 ${t('share')}</button></div>`}
function orderText(rows,date){let s=`${HOST.profile().name||'Store Manager'} · ${date||today()}\n`,last='';for(const r of rows){if(r.company!==last){last=r.company;s+=`\n*${r.company}*\n`}s+=`• ${r.product}: ${r.qty}\n`}
 return s+`\nTotal quantity: ${unitSum(rows,true)}`}
async function shareText(txt){if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e.name==='AbortError')return}}window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast(t('downloaded')+' · '+name)}
function doExport(kind,rows,date,coName){
 const d=date||today(),name='Order-'+(coName?coName.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-':'')+d;if(!rows.length){toast(t('nothingExp'));return}
 rows=rows.map(r=>({...r,unit:r.unit||'Box'}));
 if(kind==='txt'){navigator.clipboard.writeText(orderText(rows,d)).then(()=>toast(t('copied')),()=>toast('Copy not allowed'));return}
 if(kind==='share'){shareText(orderText(rows,d));return}
 const head=['Company','Product','Qty'],body=rows.map(r=>[r.company,r.product,r.qty]);
 if(kind==='img'){const W=1080,P=56,rowH=64,F='Inter, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Bengali", sans-serif';const gs=groups(rows);
  const H=P+150+gs.reduce((a,g)=>a+86+g.rows.length*rowH+24,0)+110;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#f3f4f8';x.fillRect(0,0,W,H);x.fillStyle='#151827';x.fillRect(0,0,W,150);
  x.fillStyle='#ffffff';x.font='800 46px '+F;x.textBaseline='middle';x.fillText(HOST.profile().name||'Store Manager',P,62);x.font='500 28px '+F;x.fillStyle='#c9ccd8';x.fillText(t('orderOn')+' · '+d+(coName?' · '+coName:''),P,112);
  const tot=rows.reduce((a,r)=>a+r.qty,0);x.textAlign='right';x.fillStyle='#ffffff';x.font='800 52px '+F;x.fillText(String(tot),W-P,70);x.font='500 24px '+F;x.fillStyle='#c9ccd8';x.fillText(t('boxes'),W-P,116);x.textAlign='left';
  const fit=(s,max)=>{if(x.measureText(s).width<=max)return s;while(s.length>1&&x.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'};
  let y=150+P;for(const g of gs){const h2=86+g.rows.length*rowH;x.fillStyle='#ffffff';x.beginPath();x.roundRect(P-16,y,W-2*P+32,h2,22);x.fill();
   x.fillStyle='#217346';x.beginPath();x.roundRect(P-16,y,W-2*P+32,74,[22,22,0,0]);x.fill();x.fillStyle='#ffffff';x.font='700 32px '+F;x.fillText(fit(g.company,W-2*P-140),P+8,y+38);
   x.textAlign='right';x.font='800 32px '+F;x.fillText(String(g.rows.reduce((a,r)=>a+r.qty,0)),W-P-8,y+38);x.textAlign='left';
   let ry=y+74;g.rows.forEach((r,i)=>{if(i){x.fillStyle='#e6e8ee';x.fillRect(P,ry,W-2*P,2)}x.fillStyle='#14161f';x.font='500 30px '+F;x.fillText(fit(r.product,W-2*P-150),P+8,ry+rowH/2+4);
    x.textAlign='right';x.font='800 34px '+F;x.fillText(String(r.qty),W-P-8,ry+rowH/2+4);x.textAlign='left';ry+=rowH});y+=h2+24}
  x.fillStyle='#151827';x.beginPath();x.roundRect(P-16,y,W-2*P+32,84,22);x.fill();x.fillStyle='#ffffff';x.font='700 32px '+F;x.fillText(t('total')+' · '+rows.length+' '+t('products').toLowerCase(),P+8,y+44);
  x.textAlign='right';x.font='800 40px '+F;x.fillText(String(tot),W-P-8,y+44);x.textAlign='left';
  cv.toBlob(blob=>{const f=new File([blob],name+'.png',{type:'image/png'}),url=URL.createObjectURL(blob),canShare=!!(navigator.canShare&&navigator.canShare({files:[f]})),canCopy=!!(navigator.clipboard&&window.ClipboardItem);
   const sh=sheet(`<h4>🖼 ${t('picture')}</h4><img src="${url}" alt="" style="width:100%;border-radius:12px;border:1px solid var(--line);display:block">
    <div class="acts"><button class="p" id="ps1" style="flex:1">⬇ ${t('savePic')}</button>${canCopy?`<button class="p" id="ps2" style="flex:1">📋 ${t('copyPic')}</button>`:''}${canShare?`<button class="g" id="ps3" style="flex:1">📤 ${t('share')}</button>`:''}</div>
    <p class="note">${t('picHint')}</p>`);
   sh.querySelector('#ps1').onclick=()=>download(blob,name+'.png');
   const c2=sh.querySelector('#ps2');if(c2)c2.onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast(t('picCopied'))}catch(e){toast(t('picNoCopy'))}};
   const c3=sh.querySelector('#ps3');if(c3)c3.onclick=async()=>{try{await navigator.share({files:[f],title:name})}catch(e){}}},'image/png');return}
 if(kind==='xlsx'){if(!window.XLSX){toast(t('libFail'));return}const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([...HOST.xlsxHead('Purchase order',d),head,...body,[],['','Total',rows.reduce((a,r)=>a+r.qty,0)]]);ws['!cols']=[{wch:28},{wch:44},{wch:8}];XLSX.utils.book_append_sheet(wb,ws,'Order');
  for(const g of groups(rows)){const w=XLSX.utils.aoa_to_sheet([[g.company,d],[],head.slice(1),...g.rows.map(r=>[r.product,r.qty]),[],['Total',g.rows.reduce((a,r)=>a+r.qty,0)]]);w['!cols']=[{wch:44},{wch:8}];
   XLSX.utils.book_append_sheet(wb,w,g.company.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31))}
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx');return}
 if(kind==='pdf'){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast(t('libFail'));return}
  const doc=new J({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth();
  let y=HOST.pdfHeader(doc,'Purchase order',d+(coName?'  ·  '+coName:''),rows.length+' products  ·  total quantity '+unitSum(rows,true));
doc.setTextColor(20);
  for(const g of groups(rows)){
   doc.autoTable({startY:y,head:[[{content:g.company+'   ('+unitSum(g.rows,true)+' qty)',colSpan:2,styles:{halign:'left',fillColor:[33,115,70],fontSize:11}}],['Product','Qty']],
    body:g.rows.map(r=>[r.product,r.qty]),
    styles:{fontSize:10,cellPadding:5},headStyles:{fillColor:[238,240,246],textColor:20},columnStyles:{1:{halign:'right',fontStyle:'bold'}},alternateRowStyles:{fillColor:[250,250,252]},margin:{left:40,right:40,top:40,bottom:50}});
   y=doc.lastAutoTable.finalY+16}
  if(y>doc.internal.pageSize.getHeight()-60){doc.addPage();y=60}
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Total quantity: '+unitSum(rows,true),40,y+6);
  HOST.pdfFooter(doc);
  download(new Blob([doc.output('arraybuffer')],{type:'application/pdf'}),name+'.pdf')}
}
function wireExport(rows,date){document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>doExport(b.dataset.x,rows,date));
 document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>shareText(orderText(rows.filter(r=>r.company===b.dataset.send),date)))}
let RSEL=[];
function review(){
 const all=orderRows(),x=totals(),gs=groups(all);RSEL=RSEL.filter(n=>gs.some(g=>g.company===n));
 const rows=RSEL.length?all.filter(r=>RSEL.includes(r.company)):all,scope=RSEL.length?RSEL.map(n=>n.replace(/^The /,'')).join(', '):t('allCos');
 const chip=(on,inner,attr)=>`<button class="chip${on?' on':''}" ${attr} style="display:flex;align-items:center;gap:7px;min-height:44px">${inner}</button>`;
 shell(t('review'),t('sumBar',{b:sumBoxes(rows),p:rows.length}),()=>go('home'),`
 ${all.length?`<div class="card"><h3 class="sec">⬇ ${t('whichExp')}</h3><div class="chips">${chip(!RSEL.length,`${t('allCos')} · ${gs.length}`,'data-all="1"')}${gs.map(g=>{const c=coById(g.cid)||{name:g.company};return chip(RSEL.includes(g.company),`${logoHTML(c,24)}${esc(g.company.replace(/^The /,''))} <b>${sumBoxes(g.rows)}</b>`,`data-co="${esc(g.company)}"`)}).join('')}</div></div>`:''}
 <div class="card"><h3 class="sec">🧾 ${t('orderOn')} · ${today()}</h3>${rows.length?orderView(rows)+`<p class="note">⬇ ${t('expScope')}: <b style="color:var(--text)">${esc(scope)}</b> · ${t('onlyQty')}</p>`+exportBox().replace(/<label>.*?<\/label>/,''):`<p class="empty">${t('empty')}</p><div class="acts"><button class="p" id="st" style="flex:1">🛒 ${t('startOrder')}</button></div>`}</div>
 ${all.length?`<div class="card"><h3 class="sec">✓ ${t('finish')}</h3><p class="note" style="margin:0">${t('finishNote')}</p><div class="acts"><button class="g" id="fin" style="flex:1">✓ ${t('saveNew')}</button><button class="d" id="clr">${t('clear')}</button></div></div>`:''}`,true);
 document.querySelectorAll('[data-co],[data-all]').forEach(b=>b.onclick=()=>{if(b.dataset.all)RSEL=[];else{const n=b.dataset.co;RSEL=RSEL.includes(n)?RSEL.filter(z=>z!==n):RSEL.concat(n)}review()});
 const coName=RSEL.length===1?RSEL[0]:null;
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>doExport(b.dataset.x,rows,null,coName));
 document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>shareText(orderText(all.filter(r=>r.company===b.dataset.send))));
 if($('#st'))$('#st').onclick=()=>go('companies');
 if($('#fin'))$('#fin').onclick=async()=>{const id=new Date().toISOString().replace(/[:.]/g,'-');const hh={date:new Date().toISOString(),rows:all.map(({cid,...r})=>r),boxes:x.boxes};await store.set('history/'+id,hh);HIST.unshift({id,...hh});ORDER={lines:{},started:null};RSEL=[];await store.set('meta/order',ORDER);toast(t('savedHist'));go('home')};
 if($('#clr'))$('#clr').onclick=async e=>{const b=e.target;if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent=t('tapAgain');return}ORDER={lines:{},started:null};RSEL=[];await store.set('meta/order',ORDER);toast(t('cleared'));go('home')};
}
/* ---------- history ---------- */
function history(){
 shell(t('history'),HIST.length+'',()=>go('home'),`<div class="card">${HIST.map(h=>`<div class="hl" data-h="${h.id}"><span><b>${esc(fmtDate(h.date))}</b><br><small class="note">${h.rows.length} ${t('products').toLowerCase()} · ${new Set(h.rows.map(r=>r.company)).size} ${t('cos').toLowerCase()}</small></span><span><span class="badge">📦 ${h.boxes}</span> <span class="chev">›</span></span></div>`).join('')||`<p class="empty">${t('noHist')}</p>`}</div>`,true);
 document.querySelectorAll('[data-h]').forEach(r=>r.onclick=()=>go('hist1',r.dataset.h));
}
function histOne(id){const h=HIST.find(x=>x.id===id);if(!h)return go('history');const d=h.date.slice(0,10);
 const rows=h.rows.map(r=>({...r,cid:(COS.find(c=>c.name===r.company)||{}).id}));
 shell(fmtDate(h.date),h.boxes+' '+t('boxes').toLowerCase(),()=>go('history'),`<div class="card"><div class="acts" style="margin:0 0 12px"><button class="p" id="re" style="flex:1">↺ ${t('copyInto')}</button></div>${orderView(rows)}${exportBox()}</div>`,true);
 wireExport(rows,d);
 $('#re').onclick=()=>{let n=0;for(const r of h.rows){const c=COS.find(x=>x.name===r.company);const p=c&&c.products.find(x=>x.name===(r.pname||r.product)&&(x.size||'')===r.size);if(p){ORDER.lines[p.id]={cid:c.id,qty:r.qty};n++}}if(!ORDER.started)ORDER.started=new Date().toISOString();saveOrder();toast(t('copiedN',{n}));go('review')};
}

boot().catch(e=>{app.innerHTML='<p class="note flag">Error: '+esc(e&&(e.message||e.code)||e)+'</p>'});
